# GitBook Site Git Sync configuration for arambarnett/monkeygun-docs (branch main).
# Schema: https://api.gitbook.com/gitbook-docs.yaml
$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1
site:
  title: Monkeygun
  structure:
    # One section, one space: the whole documentation tree lives at the repository root
    # (README.md + SUMMARY.md). The API reference pages (api-reference/*.md, OpenAPI
    # blocks over openapi.json) are part of the same space via SUMMARY.md.
    - type: section
      key: docs
      title: Documentation
      path: docs
      default: true
      children:
        - type: space
          key: documentation
          title: Documentation
          path: documentation
          default: true
          content:
            directory: .
            language: en
